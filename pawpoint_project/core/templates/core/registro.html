{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tutor - PawPOINT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 50%, #7c3aed 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            ring: 2px solid rgba(255, 255, 255, 0.3);
        }
        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .glass-input:-webkit-autofill,
        .glass-input:-webkit-autofill:hover,
        .glass-input:-webkit-autofill:focus {
            -webkit-text-fill-color: white;
            -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.1) inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body>
    
    <div class="max-w-md w-full p-8 rounded-xl glass-effect mx-4">
        
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-4xl font-extrabold text-white mb-1 tracking-wider">🐾 PawPOINT</h1>
            <p class="text-sm text-white opacity-70">Crea tu cuenta como Tutor</p>
        </div>

        <div class="w-full h-px bg-white opacity-20 mb-6"></div>

        <div id="mensaje-alert" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <form id="formulario-registro" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-white mb-1 opacity-80">Nombre *</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        class="glass-input w-full px-4 py-2 rounded-lg transition duration-200" 
                        placeholder="Tu nombre"
                        required
                    >
                </div>
                <div>
                    <label for="apellido" class="block text-sm font-medium text-white mb-1 opacity-80">Apellido *</label>
                    <input 
                        type="text" 
                        id="apellido" 
                        name="apellido" 
                        class="glass-input w-full px-4 py-2 rounded-lg transition duration-200" 
                        placeholder="Tu apellido"
                        required
                    >
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-white mb-1 opacity-80">Email *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="glass-input w-full px-4 py-2 rounded-lg transition duration-200" 
                    placeholder="tu@email.com"
                    required
                >
            </div>

            <div>
                <label for="rut" class="block text-sm font-medium text-white mb-1 opacity-80">RUT *</label>
                <input 
                    type="text" 
                    id="rut" 
                    name="rut" 
                    class="glass-input w-full px-4 py-2 rounded-lg transition duration-200" 
                    placeholder="12345678-9"
                    required
                >
                <p class="text-xs text-white opacity-60 mt-1">Formato: 12345678-9</p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-white mb-1 opacity-80">Contraseña *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="glass-input w-full px-4 py-2 rounded-lg transition duration-200" 
                    placeholder="Mínimo 6 caracteres"
                    required
                    minlength="6"
                >
            </div>

            <div>
                <label for="password-confirm" class="block text-sm font-medium text-white mb-1 opacity-80">Confirmar Contraseña *</label>
                <input 
                    type="password" 
                    id="password-confirm" 
                    name="password_confirm" 
                    class="glass-input w-full px-4 py-2 rounded-lg transition duration-200" 
                    placeholder="Confirma tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="w-full py-3 rounded-lg font-bold text-gray-800 transition duration-300 transform hover:scale-[1.02] bg-white hover:bg-gray-100 shadow-xl flex justify-center items-center gap-2 mt-6" id="btn-submit">
                <span>Registrarse</span>
                <svg id="spinner" class="animate-spin h-5 w-5 text-gray-800 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>

            <div class="mt-6 text-center text-sm">
                <a href="{% url 'login_view' %}" class="text-white opacity-70 hover:opacity-100 transition duration-200">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </div>
        </form>
    </div>

    <script src="{% static 'core/js/registro.js' %}"></script>
</body>
</html>
