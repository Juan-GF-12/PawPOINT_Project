{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portal - PawPoint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/portal.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- HEADER STICKY CON SALUDO PERSONALIZADO -->
    <div class="portal-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="user-greeting" id="user-greeting">¡Hola! 👋</h1>
                    <p class="subtitle">Bienvenido a tu portal de mascotas</p>
                </div>
                <button class="btn btn-icon" onclick="logout()" title="Cerrar sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <!-- PRÓXIMA CITA - Destacado -->
        <div id="proxima-cita-container" class="mb-4 fade-in-up">
            <div class="card-glass">
                <div class="card-body-glass text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>

        <!-- RECETA DIGITAL -->
        <div id="receta-digital-section" class="receta-digital-section fade-in-up animation-delay-1" style="display: none;">
            <div class="receta-header">
                <div class="receta-icon">
                    <i class="fas fa-prescription"></i>
                </div>
                <div>
                    <h2 class="receta-title">Receta Digital</h2>
                    <p class="subtitle mb-0">Tratamientos activos de tus mascotas</p>
                </div>
            </div>
            <div id="recetas-container">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>

        <!-- MIS MASCOTAS -->
        <h5 class="fw-bold mb-3 mt-4 fade-in-up animation-delay-2">
            <i class="fas fa-paw me-2"></i>Tus Mascotas
        </h5>
        <div id="mis-mascotas-container" class="row g-3">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/portal.js' %}"></script>
</body>
</html>
