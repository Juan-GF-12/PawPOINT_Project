{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PawPOINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="{% static 'core/js/validaciones.js' %}"></script>
    
    <!-- Estilos base para el Glassmorphism -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 50%, #7c3aed 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="max-w-md w-full p-8 rounded-xl glass-effect">
        
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-4xl font-extrabold text-white mb-1 tracking-wider">PawPOINT</h1>
            <p class="text-sm text-white opacity-70">Crea tu cuenta</p>
        </div>

        <div class="w-full h-px bg-white opacity-20 mb-6"></div> 
        
        <!-- Mensajes de Error/Éxito -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-white"></div>

        <form id="register-form">
            <!-- Nombre -->
            <div class="mb-4">
                <label for="nombre" class="block text-sm font-medium text-white mb-1 opacity-80">Nombre *</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre" required minlength="2" maxlength="50"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="nombre-error" class="text-xs text-red-400 mt-1 hidden"></p>
            </div>
            
            <!-- Apellido -->
            <div class="mb-4">
                <label for="apellido" class="block text-sm font-medium text-white mb-1 opacity-80">Apellido *</label>
                <input type="text" id="apellido" placeholder="Ingresa tu apellido" required minlength="2" maxlength="50"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="apellido-error" class="text-xs text-red-400 mt-1 hidden"></p>
            </div>
            
            <!-- RUT -->
            <div class="mb-4">
                <label for="rut" class="block text-sm font-medium text-white mb-1 opacity-80">RUT *</label>
                <input type="text" id="rut" placeholder="12345678-9" required maxlength="10"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="rut-error" class="text-xs text-red-400 mt-1 hidden"></p>
                <p class="text-xs text-white opacity-60 mt-1">Formato: 12345678-9 (K se reemplaza con 1)</p>
            </div>
            
            <!-- Correo Electrónico -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-white mb-1 opacity-80">Correo Electrónico *</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="email-error" class="text-xs text-red-400 mt-1 hidden"></p>
            </div>

            <!-- Nombre de Usuario (auto-generado, editable) -->
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-white mb-1 opacity-80">Nombre de Usuario *</label>
                <input type="text" id="username" placeholder="usuario123" required minlength="3" maxlength="30"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="username-error" class="text-xs text-red-400 mt-1 hidden"></p>
                <p class="text-xs text-white opacity-60 mt-1">Sugerido automáticamente desde tu email. Úsalo para iniciar sesión.</p>
            </div>
            
            <!-- Teléfono -->
            <div class="mb-4">
                <label for="telefono" class="block text-sm font-medium text-white mb-1 opacity-80">Teléfono (opcional)</label>
                <input type="tel" id="telefono" placeholder="+56 9 1234 5678" maxlength="15"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="telefono-error" class="text-xs text-red-400 mt-1 hidden"></p>
            </div>
            
            <!-- Contraseña -->
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-white mb-1 opacity-80">Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="password-error" class="text-xs text-red-400 mt-1 hidden"></p>
            </div>
            
            <!-- Confirmar Contraseña -->
            <div class="mb-6">
                <label for="confirm-password" class="block text-sm font-medium text-white mb-1 opacity-80">Confirmar Contraseña *</label>
                <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required minlength="6"
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
                <p id="confirm-password-error" class="text-xs text-red-400 mt-1 hidden"></p>
            </div>
            
            <button type="submit" id="btn-register"
                class="w-full py-2 rounded-lg font-semibold text-gray-800 transition duration-300 transform hover:scale-[1.02] bg-white hover:bg-gray-100 shadow-xl flex justify-center items-center gap-2">
                <span>Registrarse</span>
                <!-- Spinner oculto por defecto -->
                <svg id="spinner" class="animate-spin h-5 w-5 text-gray-800 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm">
            <a href="{% url 'login_view' %}" class="text-white opacity-70 hover:opacity-100 transition duration-200 block">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <!-- Lógica JavaScript para conectar con Django -->
    <script>
        // ========== AUTO-GENERAR USERNAME DESDE EMAIL ==========
        
        document.getElementById('email').addEventListener('input', function(e) {
            const email = e.target.value.trim();
            const usernameInput = document.getElementById('username');
            
            if (email.includes('@')) {
                // Extraer parte antes del @
                const suggestedUsername = email.split('@')[0].toLowerCase();
                // Solo actualizar si el campo está vacío o tiene la sugerencia anterior
                if (!usernameInput.dataset.manuallyEdited) {
                    usernameInput.value = suggestedUsername;
                }
            }
        });
        
        // Marcar si el usuario editó manualmente el username
        document.getElementById('username').addEventListener('input', function() {
            this.dataset.manuallyEdited = 'true';
        });

        // ========== VALIDACIÓN EN TIEMPO REAL ==========
        
        // RUT: solo números, K->1, auto-formato
        document.getElementById('rut').addEventListener('input', function(e) {
            let valor = e.target.value;
            
            // Remover todo excepto números, guión y K
            valor = valor.replace(/[^0-9\-kK]/g, '');
            
            // Convertir K a 1
            valor = valor.replace(/[kK]/g, '1');
            
            // Auto-formatear como XXXXXXXX-X
            valor = valor.replace(/\-/g, ''); // Quitar guiones existentes
            if (valor.length > 1) {
                valor = valor.slice(0, -1) + '-' + valor.slice(-1);
            }
            
            e.target.value = valor;
            
            // Validar formato
            if (valor.length >= 9) {
                if (validarRUT(valor)) {
                    limpiarErrorCampo('rut');
                } else {
                    mostrarErrorCampo('rut', 'RUT incorrecto. Verifica el formato.');
                }
            } else {
                limpiarErrorCampo('rut');
            }
        });

        // Nombre: mínimo 2 caracteres
        document.getElementById('nombre').addEventListener('input', function(e) {
            const valor = e.target.value.trim();
            if (valor.length > 0 && valor.length < 2) {
                mostrarErrorCampo('nombre', 'El nombre debe tener al menos 2 caracteres');
            } else {
                limpiarErrorCampo('nombre');
            }
        });

        // Apellido: mínimo 2 caracteres
        document.getElementById('apellido').addEventListener('input', function(e) {
            const valor = e.target.value.trim();
            if (valor.length > 0 && valor.length < 2) {
                mostrarErrorCampo('apellido', 'El apellido debe tener al menos 2 caracteres');
            } else {
                limpiarErrorCampo('apellido');
            }
        });

        // Email: validar formato
        document.getElementById('email').addEventListener('blur', function(e) {
            const valor = e.target.value.trim();
            if (valor.length > 0 && !validarEmail(valor)) {
                mostrarErrorCampo('email', 'Email inválido. Ejemplo: usuario@correo.com');
            } else {
                limpiarErrorCampo('email');
            }
        });

        // Teléfono: opcional pero validar si tiene contenido
        document.getElementById('telefono').addEventListener('blur', function(e) {
            const valor = e.target.value.trim();
            if (valor.length > 0 && !validarTelefono(valor)) {
                mostrarErrorCampo('telefono', 'Teléfono inválido. Formato: +56912345678');
            } else {
                limpiarErrorCampo('telefono');
            }
        });

        // Contraseña: mínimo 6 caracteres
        document.getElementById('password').addEventListener('input', function(e) {
            const valor = e.target.value;
            if (valor.length > 0 && valor.length < 6) {
                mostrarErrorCampo('password', 'La contraseña debe tener al menos 6 caracteres');
            } else {
                limpiarErrorCampo('password');
            }
            
            // Re-validar coincidencia si ya se llenó confirmación
            const confirmPass = document.getElementById('confirm-password').value;
            if (confirmPass.length > 0) {
                if (valor !== confirmPass) {
                    mostrarErrorCampo('confirm-password', 'Las contraseñas no coinciden');
                } else {
                    limpiarErrorCampo('confirm-password');
                }
            }
        });

        // Confirmar contraseña: verificar coincidencia
        document.getElementById('confirm-password').addEventListener('input', function(e) {
            const password = document.getElementById('password').value;
            const confirmPass = e.target.value;
            
            if (confirmPass.length > 0 && password !== confirmPass) {
                mostrarErrorCampo('confirm-password', 'Las contraseñas no coinciden');
            } else {
                limpiarErrorCampo('confirm-password');
            }
        });

        // ========== ENVÍO DEL FORMULARIO ==========
        
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Obtener valores
            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const rut = document.getElementById('rut').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('alert-box');
            const btnRegister = document.getElementById('btn-register');
            const spinner = document.getElementById('spinner');
            
            let hayErrores = false;
            
            // Validación final antes de enviar
            if (nombre.length < 2) {
                mostrarErrorCampo('nombre', 'El nombre debe tener al menos 2 caracteres');
                hayErrores = true;
            }
            
            if (apellido.length < 2) {
                mostrarErrorCampo('apellido', 'El apellido debe tener al menos 2 caracteres');
                hayErrores = true;
            }
            
            if (!validarRUT(rut)) {
                mostrarErrorCampo('rut', 'RUT inválido. Formato: 12345678-9');
                hayErrores = true;
            }
            
            if (!validarEmail(email)) {
                mostrarErrorCampo('email', 'Email inválido');
                hayErrores = true;
            }
            
            if (username.length < 3) {
                mostrarErrorCampo('username', 'El nombre de usuario debe tener al menos 3 caracteres');
                hayErrores = true;
            }
            
            if (telefono.length > 0 && !validarTelefono(telefono)) {
                mostrarErrorCampo('telefono', 'Teléfono inválido');
                hayErrores = true;
            }
            
            if (password.length < 6) {
                mostrarErrorCampo('password', 'La contraseña debe tener al menos 6 caracteres');
                hayErrores = true;
            }
            
            if (password !== confirmPassword) {
                mostrarErrorCampo('confirm-password', 'Las contraseñas no coinciden');
                hayErrores = true;
            }
            
            if (hayErrores) {
                mostrarAlerta('Por favor corrige los errores en el formulario', 'error');
                return;
            }

            // UI de "Cargando"
            btnRegister.disabled = true;
            spinner.classList.remove('hidden');
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        apellido: apellido,
                        rut: rut,
                        email: email,
                        username: username,
                        telefono: telefono,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarAlerta('¡Cuenta de tutor creada con éxito! Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = "{% url 'login_view' %}";
                    }, 2000);
                } else {
                    // Mostrar errores del servidor en campos específicos
                    for (const [field, errors] of Object.entries(data)) {
                        let mensaje = '';
                        if (Array.isArray(errors)) {
                            mensaje = errors.join(', ');
                        } else if (typeof errors === 'string') {
                            mensaje = errors;
                        } else {
                            mensaje = JSON.stringify(errors);
                        }
                        
                        // Mapear campos del backend a IDs del frontend
                        const fieldMap = {
                            'nombre': 'nombre',
                            'apellido': 'apellido',
                            'rut': 'rut',
                            'email': 'email',
                            'username': 'username',
                            'telefono': 'telefono',
                            'password': 'password'
                        };
                        
                        if (fieldMap[field]) {
                            mostrarErrorCampo(fieldMap[field], mensaje);
                        }
                    }
                    
                    mostrarAlerta('Error en el registro. Revisa los campos marcados.', 'error');
                    btnRegister.disabled = false;
                    spinner.classList.add('hidden');
                }

            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                btnRegister.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        function mostrarAlerta(mensaje, tipo) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = mensaje;
            alertBox.classList.remove('hidden', 'bg-red-500/50', 'bg-green-500/50');
            
            if (tipo === 'error') {
                alertBox.classList.add('bg-red-500/50', 'border', 'border-red-400');
            } else {
                alertBox.classList.add('bg-green-500/50', 'border', 'border-green-400');
            }
            alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
