{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portal - PawPoint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/main.css' %}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-white bg-white shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold text-primary">🐾 PawPOINT</span>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted d-none d-md-block" id="user-name">Cargando...</span>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Próxima Cita -->
        <h5 class="fw-bold mb-3">🔔 Tu Próxima Atención</h5>
        <div id="proxima-cita-container" class="mb-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>

        <!-- Mis Mascotas -->
        <h5 class="fw-bold mb-3">🐾 Tus Mascotas</h5>
        <div id="mis-mascotas-container" class="row g-3">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/portal.js' %}"></script>
</body>
</html>
