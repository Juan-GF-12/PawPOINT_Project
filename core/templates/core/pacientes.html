{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - PawPOINT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/main.css' %}">
</head>
<body>
    
    <header class="navbar navbar-light main-header">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="d-none d-md-block w-50"><input type="text" class="form-control" placeholder="Buscar..."></div>
            <div class="d-flex align-items-center">
                <a href="#" class="nav-link"><i class="fas fa-bell fs-5"></i></a>
                <a href="#" class="nav-link ms-3"><i class="fas fa-user-circle fs-5"></i></a>
            </div>
        </div>
    </header>

    <div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="offcanvas-header border-bottom">
            <a class="d-flex align-items-center text-decoration-none" href="{% url 'dashboard_view' %}">
                <svg class="sidebar-logo me-2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 512c141.4 0 256-114.6 256-256S397.4 0 256 0 0 114.6 0 256s114.6 256 256 256zM135.2 217.4c-8.5-8.5-8.5-22.3 0-30.8l1.1-1.1c8.5-8.5 22.3-8.5 30.8 0L224 242.7l56.9-57.1c8.5-8.5 22.3-8.5 30.8 0l1.1 1.1c8.5 8.5 8.5 22.3 0 30.8L280.1 274.6l57.1 56.9c8.5 8.5 8.5 22.3 0 30.8l-1.1 1.1c-8.5 8.5-22.3 8.5-30.8 0L248.3 306.4l-56.9 57.1c-8.5 8.5-22.3 8.5-30.8 0l-1.1-1.1c-8.5-8.5-8.5-22.3 0-30.8l57.1-56.9-57.1-56.9z"/></svg>
                <h5 class="offcanvas-title fw-bold" id="sidebarLabel">PawPOINT</h5>
            </a>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-3">
            <nav class="nav flex-column">
                <a class="nav-link" href="{% url 'dashboard_view' %}"><span class="icon"><i class="fas fa-chart-line"></i></span>Inicio</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-calendar-alt"></i></span>Calendario Citas</a>
                <a class="nav-link active" href="{% url 'pacientes_view' %}"><span class="icon"><i class="fas fa-paw"></i></span>Pacientes</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-user-shield"></i></span>Tutores</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-notes-medical"></i></span>Historial Clínico</a>
                <hr>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-boxes"></i></span>Medicamentos</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-cogs"></i></span>Configuración</a>
            </nav>
        </div>
    </div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Gestión de Pacientes</h1>
            <button class="btn btn-primary btn-lg" id="btn-nuevo-paciente">
                <i class="fas fa-plus-circle me-1"></i> Ingresar Paciente
            </button>
        </div>

        <div class="card stat-card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>PACIENTE</th>
                                <th>ESPECIE</th>
                                <th>RAZA</th>
                                <th>TUTOR (ID)</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="pacientes-table-body">
                            <tr id="loading-row">
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="pacienteModal" tabindex="-1" aria-labelledby="pacienteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pacienteModalLabel">Nuevo Paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="modal-alert-error" class="alert alert-danger d-none" role="alert">
                        Error al guardar. Revisa los campos.
                    </div>
                    
                    <form id="paciente-form">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label for="paciente-tutor" class="form-label">Tutor (*)</label>
                                <select class="form-select" id="paciente-tutor" required>
                                    <option value="">Cargando tutores...</option>
                                    </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="paciente-nombre" class="form-label">Nombre Paciente (*)</label>
                                <input type="text" class="form-control" id="paciente-nombre" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="paciente-especie" class="form-label">Especie (*)</label>
                                <input type="text" class="form-control" id="paciente-especie" placeholder="Ej: Perro, Gato" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="paciente-raza" class="form-label">Raza</label>
                                <input type="text" class="form-control" id="paciente-raza" placeholder="Ej: Golden Retriever">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="paciente-genero" class="form-label">Género (*)</label>
                                <select class="form-select" id="paciente-genero" required>
                                    <option value="M">Macho</option>
                                    <option value="H">Hembra</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="paciente-fecha-nacimiento" class="form-label">Fecha Nacimiento (*)</label>
                                <input type="date" class="form-control" id="paciente-fecha-nacimiento" required>
                            </div>
                        </div>
                        
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="btn-guardar-paciente">
                                <span id="btn-guardar-texto">Guardar Paciente</span>
                                <span id="btn-guardar-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/pacientes.js' %}"></script>
</body>
</html>
