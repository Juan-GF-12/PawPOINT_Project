{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tutor - PawPOINT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/main.css' %}">
    <style>
        .registro-page {
            background: linear-gradient(135deg, #0061ff, #60efff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .registro-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }
        .registro-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .registro-header h1 {
            color: #0061ff;
            font-weight: 700;
            font-size: 2rem;
        }
        .registro-header p {
            color: #666;
            margin-top: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #0061ff;
            box-shadow: 0 0 0 3px rgba(0, 97, 255, 0.1);
            outline: none;
        }
        .btn-registrarse {
            width: 100%;
            padding: 0.75rem;
            font-weight: 700;
            border-radius: 8px;
            background: linear-gradient(135deg, #0061ff, #0049cc);
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .btn-registrarse:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 97, 255, 0.3);
        }
        .btn-registrarse:active {
            transform: translateY(0);
        }
        .form-text {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        .form-text a {
            color: #0061ff;
            text-decoration: none;
            font-weight: 600;
        }
        .form-text a:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 1.5rem;
        }
        .alert-danger {
            background-color: #ffe6e6;
            color: #cc0000;
        }
        .alert-success {
            background-color: #e6ffe6;
            color: #008000;
        }
        .spinner-border {
            display: none;
        }
        .btn-registrarse.loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .btn-registrarse.loading .spinner-border {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .registro-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="registro-page">
    <div class="registro-card">
        <div class="registro-header">
            <h1>🐾 PawPOINT</h1>
            <p>Crea tu cuenta como Tutor</p>
        </div>

        <div id="mensaje-alert" style="display: none;"></div>

        <form id="formulario-registro">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        class="form-control" 
                        placeholder="Tu nombre"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido *</label>
                    <input 
                        type="text" 
                        id="apellido" 
                        name="apellido" 
                        class="form-control" 
                        placeholder="Tu apellido"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="tu@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="rut">RUT *</label>
                <input 
                    type="text" 
                    id="rut" 
                    name="rut" 
                    class="form-control" 
                    placeholder="12345678-9"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Mínimo 6 caracteres"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="password-confirm">Confirmar Contraseña *</label>
                <input 
                    type="password" 
                    id="password-confirm" 
                    name="password_confirm" 
                    class="form-control" 
                    placeholder="Confirma tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="btn btn-registrarse" id="btn-submit">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Registrarse
            </button>

            <div class="form-text">
                ¿Ya tienes cuenta? <a href="{% url 'login_view' %}">Inicia sesión aquí</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/registro.js' %}"></script>
</body>
</html>
