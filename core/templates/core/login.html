{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesión - PawPOINT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'core/css/main.css' %}" rel="stylesheet">
</head>
<body class="login-page">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <svg class="paw-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 512c141.4 0 256-114.6 256-256S397.4 0 256 0 0 114.6 0 256s114.6 256 256 256zM135.2 217.4c-8.5-8.5-8.5-22.3 0-30.8l1.1-1.1c8.5-8.5 22.3-8.5 30.8 0L224 242.7l56.9-57.1c8.5-8.5 22.3-8.5 30.8 0l1.1 1.1c8.5 8.5 8.5 22.3 0 30.8L280.1 274.6l57.1 56.9c8.5 8.5 8.5 22.3 0 30.8l-1.1 1.1c-8.5 8.5-22.3 8.5-30.8 0L248.3 306.4l-56.9 57.1c-8.5 8.5-22.3 8.5-30.8 0l-1.1-1.1c-8.5-8.5-8.5-22.3 0-30.8l57.1-56.9-57.1-56.9z"/></svg>
                </div>

                <div class="glass-card">
                    <h3 class="text-center fw-bold mb-4">Inicio de Sesión</h3>
                    
                    <div id="alert-error" class="alert alert-danger d-none" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="username" placeholder="Ingresa tu usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">
                            <span id="btn-text">Iniciar Sesión</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'core/js/auth.js' %}"></script>
</body>
</html>
