{% extends 'core/base_dashboard.html' %}
{% load static %}

{% block title %}Historial - PawPOINT{% endblock %}
{% block header_title %}Historial Médico{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-6 h-full">

    <!-- Tarjeta de Paciente (Sticky) -->
    <div class="lg:col-span-1">
        <div class="glass-panel p-6 rounded-2xl text-center sticky top-0">
            <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-blue-400 to-purple-500 flex items-center justify-center text-4xl text-white shadow-xl mb-4 border-4 border-white/20">
                <i class="fas fa-paw"></i>
            </div>
            <h2 id="paciente-nombre" class="text-2xl font-bold text-white mb-1">Cargando...</h2>
            <div class="flex justify-center gap-2 text-sm text-blue-200 mb-4">
                <span id="paciente-especie">-</span> • <span id="paciente-raza">-</span>
            </div>
            
            <div class="bg-white/5 rounded-xl p-4 text-left space-y-2 mb-6">
                <div class="flex justify-between">
                    <span class="text-white/60 text-sm">Edad:</span>
                    <span id="paciente-edad" class="font-medium">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-white/60 text-sm">Tutor:</span>
                    <span id="paciente-tutor" class="font-medium">-</span>
                </div>
            </div>

            <button onclick="abrirModalFicha()" class="w-full py-3 rounded-xl bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 shadow-lg font-bold transition transform hover:scale-[1.02]">
                <i class="fas fa-file-medical mr-2"></i> Nueva Consulta
            </button>
        </div>
    </div>

    <!-- Timeline -->
    <div class="lg:col-span-3">
        <div id="timeline-container" class="space-y-6 pb-10">
            <!-- Los items del timeline se inyectan aquí por JS -->
            <div class="text-center py-10 text-white/50">
                <i class="fas fa-spinner fa-spin text-2xl"></i>
            </div>
        </div>
    </div>
</div>

<!-- Modal Nueva Ficha -->
<div class="modal fade" id="modalFicha" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-panel border-0 text-white">
            <div class="modal-header border-b border-white/10">
                <h5 class="modal-title font-bold text-xl">Registrar Consulta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-6">
                <div id="ficha-error" class="hidden bg-red-500/20 text-red-100 p-2 rounded mb-3 text-sm"></div>

                <form id="formFicha" class="space-y-4">
                    <div>
                        <label class="text-sm font-medium text-white/70">Motivo Consulta (*)</label>
                        <input type="text" id="ficha-motivo" class="w-full p-2.5 rounded-lg glass-input mt-1" required>
                    </div>

                    <div>
                        <label class="text-sm font-medium text-white/70">Diagnóstico (*)</label>
                        <textarea id="ficha-diagnostico" rows="3" class="w-full p-2.5 rounded-lg glass-input mt-1" required></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-sm font-medium text-white/70">Peso (kg)</label>
                            <input type="number" step="0.1" id="ficha-peso" class="w-full p-2.5 rounded-lg glass-input mt-1">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-white/70">Temp (°C)</label>
                            <input type="number" step="0.1" id="ficha-temperatura" class="w-full p-2.5 rounded-lg glass-input mt-1">
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium text-white/70">Notas Adicionales</label>
                        <textarea id="ficha-notas" rows="2" class="w-full p-2.5 rounded-lg glass-input mt-1"></textarea>
                    </div>

                    <!-- Toggle Tratamiento -->
                    <div class="pt-4 border-t border-white/10">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="agregarTratamiento" onchange="toggleTratamientoFields()" class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="font-medium text-blue-200">Añadir Tratamiento / Receta</span>
                        </label>
                    </div>

                    <div id="tratamiento-fields" class="hidden space-y-4 bg-white/5 p-4 rounded-xl border border-white/10">
                        <div>
                            <label class="text-sm font-medium text-white/70">Medicamento</label>
                            <input type="text" id="tratamiento-medicamento" class="w-full p-2.5 rounded-lg glass-input mt-1">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-white/70">Instrucciones / Dosis</label>
                            <textarea id="tratamiento-instrucciones" rows="2" class="w-full p-2.5 rounded-lg glass-input mt-1"></textarea>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-white/70">Fecha Fin (Opcional)</label>
                            <input type="date" id="tratamiento-fecha-fin" class="w-full p-2.5 rounded-lg glass-input mt-1">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-t border-white/10">
                <button type="button" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" onclick="guardarFicha()" class="px-6 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 font-bold shadow-lg">Guardar Ficha</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'core/js/historial.js' %}"></script>
{% endblock %}
