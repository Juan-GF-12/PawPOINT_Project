{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Citas - PawPOINT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/main.css' %}">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.css' rel='stylesheet' />
    <style>
        .fc {
            font-family: inherit;
        }
        .fc .fc-button-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
        .fc-event {
            border: none !important;
            padding: 4px !important;
        }
        .fc-event-title {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .estado-confirmada {
            background-color: #198754 !important;
        }
        .estado-pendiente {
            background-color: #ffc107 !important;
            color: #000 !important;
        }
        .estado-cancelada {
            background-color: #dc3545 !important;
        }
        .estado-completada {
            background-color: #0d6efd !important;
        }
    </style>
</head>
<body>
    
    <header class="navbar navbar-light main-header">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="d-none d-md-block w-50">
                <input type="text" class="form-control" placeholder="Buscar...">
            </div>
            
            <div class="d-flex align-items-center">
                <a href="#" class="nav-link"><i class="fas fa-bell fs-5"></i></a>
                <a href="#" class="nav-link ms-3"><i class="fas fa-user-circle fs-5"></i></a>
            </div>
        </div>
    </header>

    <div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="offcanvas-header border-bottom">
            <a class="d-flex align-items-center text-decoration-none" href="{% url 'dashboard_view' %}">
                <svg class="sidebar-logo me-2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M256 512c141.4 0 256-114.6 256-256S397.4 0 256 0 0 114.6 0 256s114.6 256 256 256zM135.2 217.4c-8.5-8.5-8.5-22.3 0-30.8l1.1-1.1c8.5-8.5 22.3-8.5 30.8 0L224 242.7l56.9-57.1c8.5-8.5 22.3-8.5 30.8 0l1.1 1.1c8.5 8.5 8.5 22.3 0 30.8L280.1 274.6l57.1 56.9c8.5 8.5 8.5 22.3 0 30.8l-1.1 1.1c-8.5 8.5-22.3 8.5-30.8 0L248.3 306.4l-56.9 57.1c-8.5 8.5-22.3 8.5-30.8 0l-1.1-1.1c-8.5-8.5-8.5-22.3 0-30.8l57.1-56.9-57.1-56.9z"/></svg>
                <h5 class="offcanvas-title fw-bold" id="sidebarLabel">PawPOINT</h5>
            </a>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-3">
            <nav class="nav flex-column">
                <a class="nav-link" href="{% url 'dashboard_view' %}"><span class="icon"><i class="fas fa-chart-line"></i></span>Inicio</a>
                <a class="nav-link active" href="{% url 'citas_view' %}"><span class="icon"><i class="fas fa-calendar-alt"></i></span>Calendario Citas</a>
                <a class="nav-link" href="{% url 'pacientes_view' %}"><span class="icon"><i class="fas fa-paw"></i></span>Pacientes</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-user-shield"></i></span>Tutores</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-notes-medical"></i></span>Historial Clínico</a>
                <hr>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-boxes"></i></span>Medicamentos</a>
                <a class="nav-link" href="#"><span class="icon"><i class="fas fa-cogs"></i></span>Configuración</a>
            </nav>
        </div>
    </div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Calendario de Citas</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCita" onclick="abrirModalNuevaCita()">
                <i class="fas fa-plus-circle me-2"></i>Nueva Cita
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="calendar"></div>
            </div>
        </div>
    </main>

    <!-- Modal para Crear/Editar Citas -->
    <div class="modal fade" id="modalCita" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">Nueva Cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Alerta de Error -->
                    <div id="modal-error" class="alert alert-danger d-none" role="alert"></div>

                    <form id="formCita">
                        <div class="mb-3">
                            <label for="cita-veterinario" class="form-label">Veterinario</label>
                            <select class="form-select" id="cita-veterinario" required>
                                <option value="">Seleccionar veterinario...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="cita-paciente" class="form-label">Paciente</label>
                            <select class="form-select" id="cita-paciente" required>
                                <option value="">Seleccionar paciente...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="cita-fecha" class="form-label">Fecha y Hora</label>
                            <input type="datetime-local" class="form-control" id="cita-fecha" required>
                        </div>

                        <div class="mb-3">
                            <label for="cita-motivo" class="form-label">Motivo/Descripción</label>
                            <textarea class="form-control" id="cita-motivo" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="cita-estado" class="form-label">Estado</label>
                            <select class="form-select" id="cita-estado" required>
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="CONFIRMADA">Confirmada</option>
                                <option value="CANCELADA">Cancelada</option>
                                <option value="COMPLETADA">Completada</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger d-none" id="btnEliminar" onclick="eliminarCita()">
                        <i class="fas fa-trash me-1"></i>Eliminar
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarCita()">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/citas.js' %}"></script>
</body>
</html>
