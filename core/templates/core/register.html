<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PawPOINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Estilos base para el Glassmorphism -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 50%, #7c3aed 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="max-w-md w-full p-8 rounded-xl glass-effect">
        
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-4xl font-extrabold text-white mb-1 tracking-wider">PawPOINT</h1>
            <p class="text-sm text-white opacity-70">Crea tu cuenta</p>
        </div>

        <div class="w-full h-px bg-white opacity-20 mb-6"></div> 
        
        <!-- Mensajes de Error/Éxito -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-white"></div>

        <form id="register-form">
            <!-- Campo Usuario -->
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-white mb-1 opacity-80">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
            </div>
            
            <!-- Campo Correo Electrónico -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-white mb-1 opacity-80">Correo Electrónico</label>
                <input type="email" id="email" placeholder="Ingresa tu correo electrónico" required
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
            </div>
            
            <!-- Campo Contraseña -->
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-white mb-1 opacity-80">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
            </div>
            
            <!-- Campo Confirmar Contraseña -->
            <div class="mb-6">
                <label for="confirm-password" class="block text-sm font-medium text-white mb-1 opacity-80">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" required
                    class="w-full px-4 py-2 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-white placeholder-white placeholder-opacity-50 transition">
            </div>
            
            <button type="submit" id="btn-register"
                class="w-full py-2 rounded-lg font-semibold text-gray-800 transition duration-300 transform hover:scale-[1.02] bg-white hover:bg-gray-100 shadow-xl flex justify-center items-center gap-2">
                <span>Registrarse</span>
                <!-- Spinner oculto por defecto -->
                <svg id="spinner" class="animate-spin h-5 w-5 text-gray-800 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm">
            <a href="{% url 'login_view' %}" class="text-white opacity-70 hover:opacity-100 transition duration-200 block">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <!-- Lógica JavaScript para conectar con Django -->
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que la página se recargue

            // 1. Obtener valores
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('alert-box');
            const btnRegister = document.getElementById('btn-register');
            const spinner = document.getElementById('spinner');

            // 2. Validaciones básicas frontend
            if (password !== confirmPassword) {
                mostrarAlerta('Las contraseñas no coinciden', 'error');
                return;
            }

            // 3. UI de "Cargando"
            btnRegister.disabled = true;
            spinner.classList.remove('hidden');
            alertBox.classList.add('hidden');

            try {
                // 4. Enviar datos a la API de Django
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Importante: No enviamos token porque el usuario aún no lo tiene
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // 5. Éxito
                    mostrarAlerta('¡Cuenta creada con éxito! Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = "{% url 'login_view' %}";
                    }, 2000);
                } else {
                    // 6. Error del servidor (ej: usuario ya existe)
                    let errorMsg = 'Error al registrarse';
                    if (data.username) errorMsg = `Usuario: ${data.username[0]}`;
                    else if (data.email) errorMsg = `Email: ${data.email[0]}`;
                    else if (data.password) errorMsg = `Contraseña: ${data.password[0]}`;
                    
                    mostrarAlerta(errorMsg, 'error');
                    btnRegister.disabled = false;
                    spinner.classList.add('hidden');
                }

            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                btnRegister.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        function mostrarAlerta(mensaje, tipo) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = mensaje;
            alertBox.classList.remove('hidden', 'bg-red-500/50', 'bg-green-500/50');
            
            if (tipo === 'error') {
                alertBox.classList.add('bg-red-500/50', 'border', 'border-red-400');
            } else {
                alertBox.classList.add('bg-green-500/50', 'border', 'border-green-400');
            }
            alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
